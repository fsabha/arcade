<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05070c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>River Raid</title>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="game" width="240" height="320"></canvas>
        <div id="crt"></div>
      </div>
      <div id="touch" aria-label="Controles de toque">
        <div class="group">
          <button type="button" data-action="left" aria-label="Esquerda">&#9664;</button>
          <button type="button" data-action="right" aria-label="Direita">&#9654;</button>
        </div>
        <div class="group">
          <button type="button" data-action="up" aria-label="Acelerar">&#9650;</button>
          <button type="button" data-action="down" aria-label="Frear">&#9660;</button>
        </div>
        <div class="group">
          <button type="button" data-action="fire" class="fire" aria-label="Atirar">FOGO</button>
          <button type="button" data-action="pause" class="small" aria-label="Pausa">II</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
